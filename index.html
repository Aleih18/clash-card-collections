<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Troop Collection</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg-0:#0b0e14;
    --bg-1:#141a24;
    --bg-2:#1c2431;
    --stone:#2a3342;
    --parchment:#e8dcc0;
    --ink:#c9d1de;
    --ink-dim:#7c8798;
    --accent:#f2c14e;
    --accent-2:#c98bff;
    --danger:#e5484d;
    --ok:#54c98a;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:transparent;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 500px at 50% -10%, #1e2836 0%, transparent 60%),
      linear-gradient(180deg,var(--bg-0),var(--bg-1) 40%, var(--bg-0));
    min-height:100vh;
    padding:18px 14px 60px;
  }

  .wrap{max-width:980px;margin:0 auto;}

  /* ---- Header banner ---- */
  .banner{
    position:relative;
    background:linear-gradient(180deg,#232c3a,#181e29);
    border:1px solid #333f52;
    border-radius:14px;
    padding:20px 22px;
    margin-bottom:22px;
    overflow:hidden;
  }
  .banner::before{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(120deg, rgba(242,193,78,0.08), transparent 40%, rgba(165,107,255,0.08));
    pointer-events:none;
  }
  .banner h1{
    font-family:'Cinzel',serif;
    font-weight:900;
    letter-spacing:1.5px;
    font-size:22px;
    margin:0 0 4px;
    background:linear-gradient(90deg,var(--accent),var(--parchment) 60%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-transform:uppercase;
  }
  .banner p.sub{margin:0 0 16px;color:var(--ink-dim);font-size:13px;}

  .progress-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .progress-track{
    flex:1 1 220px;
    height:14px;
    background:#0e131c;
    border-radius:8px;
    border:1px solid #2c3648;
    overflow:hidden;
    position:relative;
  }
  .progress-fill{
    height:100%;
    border-radius:8px;
    background:linear-gradient(90deg,var(--accent-2),var(--accent));
    transition:width .4s ease;
  }
  .progress-count{
    font-family:'Cinzel',serif;
    font-weight:700;
    font-size:15px;
    color:var(--parchment);
    white-space:nowrap;
  }

  /* ---- Controls ---- */
  .controls{
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    margin-top:16px;
  }
  .tabs{display:flex;gap:6px;background:#0e131c;border:1px solid #2c3648;border-radius:10px;padding:4px;}
  .tab{
    border:none;background:transparent;color:var(--ink-dim);
    font-family:'Inter';font-weight:600;font-size:12.5px;
    padding:7px 12px;border-radius:7px;cursor:pointer;transition:all .15s;
  }
  .tab.active{background:var(--stone);color:var(--parchment);}
  .search{
    flex:1 1 160px;
    background:#0e131c;border:1px solid #2c3648;border-radius:10px;
    padding:8px 12px;color:var(--ink);font-size:13px;font-family:'Inter';
  }
  .search::placeholder{color:var(--ink-dim);}
  .reset-btn{
    border:1px solid #3a2530;background:#241419;color:#f0a3a8;
    font-size:12px;font-weight:600;padding:8px 12px;border-radius:10px;cursor:pointer;
  }
  .reset-btn:hover{background:#2e181e;}

  .export-row{
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    margin-top:10px;padding-top:12px;border-top:1px dashed #2c3648;
  }
  .export-btn{
    border:1px solid #3a4a3f;background:#152018;color:#8fe0b0;
    font-size:12px;font-weight:600;padding:8px 12px;border-radius:10px;cursor:pointer;
    white-space:nowrap;
  }
  .export-btn:hover{background:#1b2a20;}
  .export-btn.copied{background:var(--ok);color:#0b0e14;border-color:var(--ok);}
  .import-btn{
    border:1px solid #3a3f52;background:#141826;color:#a9b8f0;
  }
  .import-btn:hover{background:#1a2033;}

  .export-preview{
    background:#0e131c;border:1px solid #2c3648;border-radius:12px;
    padding:12px;margin-bottom:20px;
  }
  .export-preview-head{
    display:flex;align-items:center;justify-content:space-between;
    font-family:'Cinzel',serif;font-size:12px;color:var(--parchment);
    margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase;
  }
  .close-preview{
    background:none;border:none;color:var(--ink-dim);font-size:14px;cursor:pointer;
  }
  #exportText{
    width:100%;min-height:220px;background:#0b0e14;color:#a9e8c0;
    border:1px solid #2c3648;border-radius:8px;padding:10px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
    resize:vertical;line-height:1.5;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(84px,1fr));
    gap:10px;
  }

  /* ---- Card ---- */
  .card{
    position:relative;
    aspect-ratio:3/3.6;
    border-radius:12px;
    cursor:pointer;
    transition:transform .12s ease;
    user-select:none;
    /* overflow is intentionally visible here so the count badge below can hang off the edge */
  }
  .card:active{transform:scale(0.94);}
  .card.owned:hover{transform:translateY(-2px);}

  .card-inner{
    position:relative;
    width:100%;height:100%;
    border-radius:12px;
    background:#141a24;
    border:2px solid #2a3342;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:6px 4px;
    transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
    filter:grayscale(0.85) brightness(0.7);
    overflow:hidden;
    background-size:cover;
    background-position:center;
  }
  .card.owned .card-inner{
    filter:none;
    border-color:var(--accent);
    box-shadow:0 0 0 1px var(--accent) inset, 0 6px 16px -6px var(--accent);
  }
  .card.has-img .card-mono{display:none;}
  .card.has-img .card-inner{background-color:#000;}
  .card.has-img .card-inner::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, transparent 45%, rgba(0,0,0,.85) 100%);
    pointer-events:none;
  }

  .card-mono{
    font-family:'Cinzel',serif;font-weight:700;font-size:20px;
    color:var(--parchment);
    opacity:.9;
    line-height:1;
  }
  .card-name{
    font-size:9.5px;font-weight:600;text-align:center;
    margin-top:6px;line-height:1.15;
    color:var(--ink);
    max-width:92%;
    position:relative;z-index:1;
  }
  .card.owned .card-name{color:var(--parchment);}
  .card.has-img .card-name{margin-top:auto;}

  .count-badge{
    position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
    background:#0e131c;border:1px solid var(--accent);color:var(--parchment);
    font-size:10px;font-weight:700;font-family:'Cinzel',serif;
    padding:1px 6px;border-radius:8px;z-index:3;
  }

  .empty-msg{
    text-align:center;color:var(--ink-dim);font-size:13px;
    padding:30px 0;
  }

  .footer-note{
    text-align:center;color:var(--ink-dim);font-size:11px;margin-top:30px;
  }

  @media(max-width:420px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(70px,1fr));}
    .card-mono{font-size:16px;}
    .card-name{font-size:8.5px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="banner">
    <h1>Troop Collection</h1>
    <p class="sub">Tap a card to add it · tap again to stack copies · right-click (or long-press) to remove one</p>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-count" id="progressCount">0 / 0</div>
    </div>
    <div class="controls">
      <div class="tabs" id="tabs">
        <button class="tab active" data-filter="all">All</button>
        <button class="tab" data-filter="owned">Owned</button>
        <button class="tab" data-filter="missing">Missing</button>
      </div>
      <input class="search" id="search" type="text" placeholder="Search troop…">
      <button class="reset-btn" id="resetBtn">Reset</button>
    </div>
    <div class="export-row">
      <input class="search" id="memberName" type="text" placeholder="Member name (for the database)" style="flex:1 1 220px;">
      <button class="export-btn import-btn" id="importJsonBtn">⬆ Import JSON</button>
      <input type="file" id="importJsonInput" accept="application/json,.json" style="display:none;">
      <button class="export-btn" id="exportJsonBtn">⬇ Export JSON</button>
      <button class="export-btn" id="copyBtn">⧉ Copy dictionary</button>
    </div>
  </div>

  <div id="tiers"></div>

  <div class="export-preview" id="exportPreview" style="display:none;">
    <div class="export-preview-head">
      <span>Dictionary preview</span>
      <button class="close-preview" id="closePreview">✕</button>
    </div>
    <textarea id="exportText" readonly spellcheck="false"></textarea>
  </div>

  <p class="footer-note" id="statusNote">Loading inventory…</p>
</div>


<script>
(function(){
  const ALL_NAMES = [
    'Barbarian','Archer','Giant','Goblin','Wall Breaker','Balloon','Wizard','Healer','Dragon','PEKKA',
    'Baby Dragon','Miner','Electro Dragon','Yeti','Dragon Rider','Electro Titan','Root Rider','Thrower',
    'Meteor Golem','Minion','Hog Rider','Valkyrie','Golem','Witch','Lava Hound','Bowler','Ice Golem',
    'Headhunter','Apprentice Warden','Druid','Furnace','Ruin Witch','Raged Barbarian','Sneaky Archer',
    'Boxer Giant','Beta Minion','Bomber','Builder Baby Dragon','Cannon Cart','Night Witch','Drop Ship',
    'Super PEKKA','Hog Glider','Super Barbarian','Super Archer','Super Giant','Sneaky Goblin',
    'Super Wall Breaker','Rocket Balloon','Super Wizard','Super Dragon','Inferno Dragon','Super Miner',
    'Super Yeti','Super Minion','Super Hog Rider','Super Valkyrie','Super Witch','Ice Hound','Super Bowler'
  ];

  const INV_KEY = 'coc-card-inventory';
  const IMG_FOLDER = 'img/';
  const IMG_EXTENSIONS = ['png','jpg','jpeg','webp'];
  const MAX_COPIES = 9;

  let inventory = {};
  ALL_NAMES.forEach(n=>inventory[n]=0);
  let images = {};
  let currentFilter = 'all';
  let searchTerm = '';

  function mono(name){
    const parts = name.split(' ');
    if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0]+parts[1][0]).toUpperCase();
  }

  function checkImage(path){
    return new Promise((resolve)=>{
      const img = new Image();
      img.onload = ()=>resolve(path);
      img.onerror = ()=>resolve(null);
      img.src = path;
    });
  }

  function slugify(name){
    return name.toLowerCase().trim().replace(/\s+/g,'_');
  }

  function resolveImagePath(name){
    const slug = slugify(name);
    const attempts = IMG_EXTENSIONS.map(ext=>{
      const path = IMG_FOLDER+encodeURIComponent(slug)+'.'+ext;
      return checkImage(path);
    });
    return Promise.all(attempts).then(results=>results.find(p=>p) || null);
  }

  async function loadImages(){
    await Promise.all(ALL_NAMES.map(async name=>{
      const path = await resolveImagePath(name);
      if(path) images[name] = path;
    }));
  }

  async function load(){
    try{
      const raw = localStorage.getItem(INV_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        ALL_NAMES.forEach(n=>{ if(typeof parsed[n]==='number') inventory[n]=parsed[n]; });
      }
    }catch(e){}
    document.getElementById('statusNote').textContent = 'Loading images…';
    render();
    await loadImages();
    document.getElementById('statusNote').textContent = 'Your progress is saved automatically in this browser.';
    render();
  }

  let saveTimeout=null;
  function persistInventory(){
    if(saveTimeout) clearTimeout(saveTimeout);
    saveTimeout = setTimeout(()=>{
      try{ localStorage.setItem(INV_KEY, JSON.stringify(inventory)); }
      catch(e){ document.getElementById('statusNote').textContent = 'Could not save progress.'; }
    }, 250);
  }

  function setCount(name, val){
    inventory[name] = Math.max(0, Math.min(MAX_COPIES, val));
    persistInventory();
    render();
  }

  function cardMatchesFilter(name){
    const owned = inventory[name] > 0;
    if(currentFilter==='owned' && !owned) return false;
    if(currentFilter==='missing' && owned) return false;
    if(searchTerm && !name.toLowerCase().includes(searchTerm)) return false;
    return true;
  }

  function render(){
    const tiersEl = document.getElementById('tiers');
    tiersEl.innerHTML = '';

    let totalOwned=0;
    ALL_NAMES.forEach(n=>{ if(inventory[n]>0) totalOwned++; });

    document.getElementById('progressCount').textContent = totalOwned+' / '+ALL_NAMES.length;
    document.getElementById('progressFill').style.width = (ALL_NAMES.length? (totalOwned/ALL_NAMES.length*100):0)+'%';

    const visibleCards = ALL_NAMES.filter(cardMatchesFilter);

    if(visibleCards.length===0){
      const msg = document.createElement('div');
      msg.className='empty-msg';
      msg.textContent = 'No cards match this filter.';
      tiersEl.appendChild(msg);
      return;
    }

    const grid = document.createElement('div');
    grid.className='grid';

    visibleCards.forEach(name=>{
      const count = inventory[name];
      const owned = count>0;
      const hasImg = !!images[name];
      const card = document.createElement('div');
      card.className = 'card'+(owned?' owned':'')+(hasImg?' has-img':'');

      const inner = document.createElement('div');
      inner.className = 'card-inner';
      if(hasImg){
        inner.style.backgroundImage = "url('"+images[name]+"')";
      }
      inner.innerHTML =
        '<div class="card-mono">'+mono(name)+'</div>'+
        '<div class="card-name">'+name+'</div>';
      card.appendChild(inner);

      if(count>1){
        const badge = document.createElement('div');
        badge.className = 'count-badge';
        badge.textContent = 'x'+count;
        card.appendChild(badge);
      }

      card.addEventListener('click', ()=>{
        setCount(name, count+1);
      });

      card.addEventListener('contextmenu', (e)=>{
        e.preventDefault();
        if(count>0) setCount(name, count-1);
      });

      grid.appendChild(card);
    });

    tiersEl.appendChild(grid);
  }

  document.getElementById('tabs').addEventListener('click', (e)=>{
    const btn = e.target.closest('.tab');
    if(!btn) return;
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });

  document.getElementById('search').addEventListener('input', (e)=>{
    searchTerm = e.target.value.trim().toLowerCase();
    render();
  });

  document.getElementById('resetBtn').addEventListener('click', ()=>{
    if(!confirm('Reset the whole inventory to zero?')) return;
    ALL_NAMES.forEach(n=>inventory[n]=0);
    persistInventory();
    render();
  });

  function sanitizeFileName(str){
    return (str||'member').trim().replace(/[^a-z0-9_\-]+/gi,'_').replace(/^_+|_+$/g,'') || 'member';
  }

  function buildExportObject(){
    const name = document.getElementById('memberName').value.trim();
    return {
      member: name || null,
      date: new Date().toISOString(),
      inventory: inventory
    };
  }

  function pythonDictText(){
    const lines = ALL_NAMES.map(n=>"    '"+n.replace(/'/g,"\\'")+"': "+inventory[n]+",");
    return "inventory = {\n"+lines.join('\n')+"\n}";
  }

  function showPreview(text){
    const box = document.getElementById('exportPreview');
    const area = document.getElementById('exportText');
    area.value = text;
    box.style.display = 'block';
    box.scrollIntoView({behavior:'smooth', block:'nearest'});
    area.focus();
    area.select();
  }

  document.getElementById('closePreview').addEventListener('click', ()=>{
    document.getElementById('exportPreview').style.display='none';
  });

  document.getElementById('importJsonBtn').addEventListener('click', ()=>{
    document.getElementById('importJsonInput').click();
  });

  document.getElementById('importJsonInput').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;

    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        const importedInventory = data.inventory || data; // allow raw {name: count} too

        if(typeof importedInventory !== 'object' || importedInventory === null){
          throw new Error('No inventory found in this file.');
        }

        const unknown = Object.keys(importedInventory).filter(n=>!ALL_NAMES.includes(n));
        const missing = ALL_NAMES.filter(n=>!(n in importedInventory));

        ALL_NAMES.forEach(n=>{
          const val = importedInventory[n];
          inventory[n] = (typeof val === 'number' && isFinite(val)) ? Math.max(0, Math.min(MAX_COPIES, Math.round(val))) : 0;
        });

        if(data.member){
          document.getElementById('memberName').value = data.member;
        }

        persistInventory();
        render();

        let note = 'Imported'+(data.member ? ' "'+data.member+'"' : '')+' successfully.';
        if(missing.length) note += ' '+missing.length+' card(s) not in the file were set to 0.';
        if(unknown.length) note += ' '+unknown.length+' unknown card(s) in the file were ignored.';
        document.getElementById('statusNote').textContent = note;
      }catch(err){
        alert('Could not import this file: '+err.message);
      }finally{
        e.target.value = ''; // allow re-selecting the same file later
      }
    };
    reader.onerror = ()=>{ alert('Could not read this file.'); };
    reader.readAsText(file);
  });

  document.getElementById('exportJsonBtn').addEventListener('click', ()=>{
    const data = buildExportObject();
    const text = JSON.stringify(data, null, 2);
    try{
      const blob = new Blob([text], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = sanitizeFileName(document.getElementById('memberName').value)+'_inventory.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
    }catch(e){
      showPreview(text);
    }
  });

  document.getElementById('copyBtn').addEventListener('click', async ()=>{
    const text = pythonDictText();
    const btn = document.getElementById('copyBtn');
    try{
      await navigator.clipboard.writeText(text);
      btn.textContent = '✓ Copied';
      btn.classList.add('copied');
      setTimeout(()=>{ btn.textContent='⧉ Copy dictionary'; btn.classList.remove('copied'); }, 1600);
    }catch(e){
      showPreview(text);
    }
  });

  render();
  load();
})();
</script>
</body>
</html>
